name: Oracle ARM Grabber

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf "%s\n" "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Run Stack Job
        id: apply
        run: |
          set +e
          ~/bin/oci resource-manager job create-apply-job \
            --stack-id "${{ secrets.OCI_STACK_ID }}" \
            --execution-plan-strategy "AUTO_APPROVED" \
            --wait-for-state SUCCEEDED \
            --wait-for-state FAILED \
            > job_result.json
          CREATE_ERR=$?
          set -e

          STATE="API_ERROR"
          if [ $CREATE_ERR -eq 0 ]; then
            STATE=$(cat job_result.json | grep '"lifecycle-state"' | head -1 | cut -d'"' -f4)
          fi

          echo "APPLY STATE: $STATE"
          echo "state=STATE">>STATE" >>STATE">>GITHUB_OUTPUT

      - name: Notify Telegram on Success
        if: steps.apply.outputs.state == 'SUCCEEDED'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            --data-urlencode "text=🎉🎉🎉 ORACLE VM ได้แล้ว!! ✅ Instance ถือกำเนิดสำเร็จ! 👉 Console → Compute → Instances → openclaw-server แล้ว ssh ubuntu@IP deploy bot 🐋"

      - name: Summary Log
        if: always()
        run: |
          case "${{ steps.apply.outputs.state }}" in
            SUCCEEDED) echo "SUCCESS - VM created!" ;;
            FAILED) echo "Apply failed - mostly out of host capacity, will retry in 30 min" ;;
            *) echo "API error - check secrets/config" ;;
          esac
