name: Launch OCI A1 Instance

on:
  schedule:
    - cron: '*/5 * * * *'   # รันทุก 5 นาที
  workflow_dispatch:         # ปุ่มกดรันเองได้

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Update Stack Variables (1 OCPU / 6 GB)
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_ID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_ID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          oci resource-manager stack update \
            --stack-id "${{ secrets.OCI_STACK_ID }}" \
            --variables '{"ocpus":"1","memory_in_gbs":"6"}' \
            --wait-for-state ACTIVE \
            --max-wait-seconds 300 \
            --force

      - name: Try Launch (Apply)
        id: apply
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_ID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_ID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          RESULT=$(oci resource-manager job create-apply-job \
            --stack-id "${{ secrets.OCI_STACK_ID }}" \
            --execution-plan-strategy AUTO_APPROVED \
            --display-name "auto-launch-$(date +%s)" \
            --wait-for-state SUCCEEDED \
            --wait-for-state FAILED \
            --max-wait-seconds 1800 \
            --query 'data."lifecycle-state"' --raw-output 2>&1) || RESULT="FAILED"
          echo "result=RESULT">>"RESULT" >> "RESULT">>"GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RESULT: ${{ steps.apply.outputs.result }}
        run: |
          if [ "$RESULT" == "SUCCEEDED" ]; then
            TEXT="🎉 ได้เครื่องแล้ว! A1 1 OCPU / 6GB สร้างสำเร็จ — เข้า OCI Console ดูได้เลย แล้วไปปิด workflow ใน GitHub ด้วย!"
          elif echo "$RESULT" | grep -qi "out of capacity\|LimitExceeded\|QuotaExceeded"; then
            TEXT="⏳ ยัง Out of Capacity — จะลองใหม่รอบหน้า (5 นาที)"
          else
            TEXT="⚠️ Launch ล้มเหลว (state: $RESULT) — เปิดดู log ใน Actions"
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="CHATID"−dtext="{CHAT_ID}" -d text="CHATI​D"−dtext="{TEXT}"
