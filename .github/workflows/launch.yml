name: Oracle ARM Grabber

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf "%s\n" "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Run Stack Job
        id: apply
        run: |
          # ยิง apply + รอผล (SUCCEEDED หรือ FAILED)
          set +e
          ~/bin/oci resource-manager job create-apply-job \
            --stack-id "${{ secrets.OCI_STACK_ID }}" \
            --execution-plan-strategy "AUTO_APPROVED" \
            --wait-for-state SUCCEEDED \
            --wait-for-state FAILED \
            > job_result.json
          CREATE_ERR=$?
          set -e

          if [ $CREATE_ERR -ne 0 ]; then
            STATE="API_ERROR"
          else
            JOB_ID=$(python3 -c "import json;print(json.load(open('job_result.json'))['data']['id'])")
            STATE=( /bin/ociresource−managerjobget−−job−id"(~/bin/oci resource-manager job get --job-id "( /bin/ociresource−managerjobget−−job−id"JOB_ID" \
              --query 'data."lifecycle-state"' --raw-output)

            # ดึง log ของ job เพื่อดู error จริง (capacity/limit)
            LOGS=$(~/bin/oci resource-manager job get-job-logs \
              --job-id "$JOB_ID" --level ERROR 2>/dev/null | \
              python3 -c "
import json,sys
try:
    rows=json.load(sys.stdin)['data']['items']
    for r in rows:
        print(r.get('message',''))
except Exception:
    pass" | tail -3)
            echo "Last errors:"
            echo "$LOGS"
          fi

          echo "state=STATE">>STATE" >>STATE">>GITHUB_OUTPUT
          echo "APPLY STATE: $STATE"

      - name: Notify Telegram on Success 🎉
        if: steps.apply.outputs.state == 'SUCCEEDED'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d text="🎉🎉🎉 ORACLE VM ได้แล้ว!!

✅ Instance ถือกำเนิดสำเร็จ!

👉 ไปดึง Public IP:
Oracle Console → Compute → Instances → openclaw-server

จากนั้น ssh ubuntu@<IP> เพื่อ deploy bot! 🐋"

      - name: Summary Log
        if: always()
        run: |
          case "${{ steps.apply.outputs.state }}" in
            SUCCEEDED) echo "✅ SUCCESS - VM created!" ;;
            FAILED)    echo "❌ Apply failed (จงใจแสดงเพื่อ grep log — ส่วนใหญ่ = out of host capacity, ปกติ)" ;;
            *)         echo "⚠️ API error - ตรวจ secrets/config" ;;
          esac
